[project]
name = "marvin-integration-cloudflare-pages"
version = "0.1.0"
description = "Cloudflare Pages integration for Marvin — site build and deploy status as Marvin events, build logs, deployments, and one-click notification setup."
readme = "README.md"
requires-python = ">=3.11"
# 0.3: HttpHelper.put/delete (updating a notification policy). mode="token" signature presets need Marvin rc.143+.
dependencies = ["marvin-integration-sdk>=0.3,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

# The seam that makes the plugin discoverable: an installed Marvin scans this group at startup.
[project.entry-points."marvin.integrations"]
cloudflare_pages = "marvin_integration_cloudflare_pages:CloudflarePagesProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_integration_cloudflare_pages"]

# Dev only: resolve the SDK from the sibling checkout. Released builds take it from the index.
[tool.uv.sources]
marvin-integration-sdk = { path = "../MarvinIntegrationSDK", editable = true }

[tool.ruff]
line-length = 150
target-version = "py311"
